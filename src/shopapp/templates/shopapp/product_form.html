{% extends "shopapp/base.html" %}

{% block title %}
Create a new product
{% endblock %}

{% block body %}
<h1>Product Form</h1>
<div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
</div>

<div>
        <a href="{% url "shopapp:products_list" %}">
        Back to products list
        </a>
</div>
{% endblock %}
